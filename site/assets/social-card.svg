  <text x="92" y="314" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="96" font-weight="600" letter-spacing="-1.5" fill="#16212B">Value<tspan fill="#C97A16">-</tspan>First</text>
  <text x="96" y="374" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="52" font-weight="400" fill="#4F5D6A">Development</text>
  <text x="96" y="440" font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="400" fill="#16212B">From ritual to value. From spec to software.</text>
  <rect x="96" y="490" width="210" height="40" rx="8" fill="#0B6E63" stroke="#0B6E63" stroke-width="2"/>
